<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none" class="hsmart-isp-logo">
  <defs>
    <linearGradient id="hsmartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E55A00" />
    </linearGradient>
    <linearGradient id="ispGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="hsmartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF8A00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- WiFi Emblem Icon -->
  <g filter="url(#hsmartGlow)">
    <rect x="2" y="4" width="40" height="40" rx="11" fill="url(#hsmartGrad)" />
  </g>

  <!-- WiFi Broadcast Waves inside emblem -->
  <path d="M12.5 16.5 C16.5 12.5 27.5 12.5 31.5 16.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M15.5 21 C18.5 18 25.5 18 28.5 21" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M18.5 25.5 C20.5 23.5 23.5 23.5 25.5 25.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="22" cy="30.5" r="2.2" fill="#FFFFFF" />

  <!-- Typography: HSmart -->
  <text x="50" y="32" font-family="'Jost', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="22" fill="currentColor" letter-spacing="-0.02em">
    HSmart
  </text>

  <!-- ISP Gradient Badge -->
  <g transform="translate(142, 13)">
    <rect width="42" height="22" rx="6" fill="url(#ispGrad)" />
    <text x="21" y="15.5" font-family="'Jost', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.08em">ISP</text>
  </g>
</svg>
